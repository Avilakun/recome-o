        .btn-hatsu-container {
                margin-top: 10px;
                width: 250px;
                display: flex;
                justify-content: center;
                border: 1px solid #00FF9D;
                background-color: #00FF9D;
                border-radius: 4px;             
            }
            .btn-hatsu-container:hover{

                transition: 0.5s;
                background-color: #01e68e;
            }

            .btn-hatsu {

                font-family: 'Orbitron', sans-serif;
                font-size: 14px;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                padding: 12px 24px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }

            .btn-hatsu:hover {
                filter: brightness(1.1);
              
            }

           
        :root {
            --theme-color-hex: #00ff9d;
            --theme-rgb: 0, 255, 157;
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* App-like feel */
        }

        /* Utilitários de Scroll */
        .custom-scrollbar { overflow-y: auto; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Inputs limpos */
        input, select, textarea { background: transparent; outline: none; }
        
        /* Containers */
        #app {
            height: 100vh; /* Fallback */
            height: 100dvh; /* Mobile modern browsers */
            display: flex;
            flex-direction: column;
            max-width: 480px; /* Mobile width constraint on desktop */
            margin: 0 auto;
            background-color: #0a0a0f;
            position: relative;
            border-left: 1px solid #1f2937;
            border-right: 1px solid #1f2937;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Safe Area Padding */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* Nen Hexagon Styles */
        .nen-node {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nen-node:active {
            transform: scale(0.95) !important;
        }
        
        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 2000px; /* Increased for content */
            opacity: 1;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        /* Custom glow for shield */
        .shield-glow {
            filter: drop-shadow(0 0 4px currentColor);
        }
        .shield-expert {
            filter: drop-shadow(0 0 6px #ffe600);
        }
        
        /* Radio Button Custom Styling */
        .custom-radio:checked + div {
            border-color: var(--theme-color-hex);
            background-color: rgba(var(--theme-rgb), 0.1);
        }
        .custom-radio:checked + div .radio-indicator {
            background-color: var(--theme-color-hex);
            border-color: var(--theme-color-hex);
        }

        /* Drag and Drop Styles */
        .dragging {
            opacity: 0.5;
            cursor: grabbing !important;
        }
        .drop-zone-active {
            border-color: var(--theme-color-hex) !important;
            background-color: rgba(var(--theme-rgb), 0.1) !important;
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.2);
        }
        
        /* Animation for Roll Modal */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid var(--theme-color-hex);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        /* Toast Notification */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 300ms ease-out;
        }
        .toast-exit {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit-active {
            transform: translateY(100%);
            opacity: 0;
            transition: all 300ms ease-in;
        }
    </style>

            if(result) {
                const r = parseInt(result[1], 16);
                const g = parseInt(result[2], 16);
                const b = parseInt(result[3], 16);
                document.documentElement.style.setProperty('--theme-rgb', `${r}, ${g}, ${b}`);
            }

        function getNenPercentages(selectedId) {
            const types = ['INTENSIFICAÇÃO', 'TRANSFORMAÇÃO', 'MATERIALIZAÇÃO', 'ESPECIALIZAÇÃO', 'MANIPULAÇÃO', 'EMISSÃO'];
            const selectedIndex = types.indexOf(selectedId);
            const matrix = {};
            types.forEach((type, index) => {
                let diff = Math.abs(index - selectedIndex);
                if (diff > 3) diff = 6 - diff;
                let pct = 0;
                if (diff === 0) pct = 100; else if (diff === 1) pct = 80; else if (diff === 2) pct = 60; else if (diff === 3) pct = 40;
                if (type === 'ESPECIALIZAÇÃO' && diff !== 0) {
                    pct = 0;
                    if (selectedId === 'MATERIALIZAÇÃO' || selectedId === 'MANIPULAÇÃO') pct = 1;
                }
                matrix[type] = pct;
            });
            return matrix;
        }

            if (r.aumento_atributo === "Distribua 3 pontos em qualquer atributo") {
                return { type: 'wildcard', amount: 3 };
            }
            if (r.aumento_atributo === "Escolha +2") {

            }
            if (typeof r.aumento_atributo === 'object') {
                if (r.aumento_atributo.INT_ou_SAB) {
                    return { type: 'choice', keys: ['INT', 'SAB'], amount: r.aumento_atributo.INT_ou_SAB };

                if (r.aumento_atributo.Físico) {
                    return { type: 'choice', keys: ['FOR', 'DES', 'CON'], amount: r.aumento_atributo.Físico };
                }
            }
            return null;

        function renderNenHexagon(selectedId, interactive) {
            const percentages = getNenPercentages(selectedId);
            const currentClass = SYSTEM_DB.classes.find(c => c.id === selectedId);
            const color = currentClass ? currentClass.color : '#00ff9d';
            
            // Calculando pontos para o SVG baseado nos ângulos
            const center = {x: 50, y: 50};
            const points = SYSTEM_DB.classes.map(c => {
                const rad = (c.angle * Math.PI) / 180;
                const r = 35; // Raio que combina com o posicionamento CSS
                return {
                    id: c.id,
                    x: 50 + (r * Math.cos(rad)),
                    y: 50 + (r * Math.sin(rad))
                };
            });

            // Encontrar ponto selecionado para desenhar a linha de conexão
            const selPoint = points.find(p => p.id === selectedId);
            
            // Polígono base
            const polyPoints = points.map(p => `${p.x},${p.y}`).join(' ');
            
            // Gerar HTML dos Nodos
            const nodesHtml = SYSTEM_DB.classes.map(c => {
                const pct = percentages[c.id];
                const isSelected = c.id === selectedId;
                const rad = (c.angle * Math.PI) / 180;
                // Usando a mesma matemática do SVG para posicionamento CSS
                const top = 50 + (35 * Math.sin(rad)); 
                const left = 50 + (35 * Math.cos(rad));
                
                let nodeContent = '';
                let borderStyle = '';
                
                if (isSelected) {
                    borderStyle = `border-color: ${c.color}; background-color: ${c.color}20; box-shadow: 0 0 15px ${c.color}; transform: scale(1.2);`;
                    nodeContent = `<span class="font-display font-black text-xs text-white drop-shadow-md">${pct}%</span>`;
                } else {
                    const opacity = pct === 0 ? 0.2 : (pct / 100);
                    borderStyle = `border-color: ${c.color}; opacity: ${0.5 + (opacity/2)}; transform: scale(${0.8 + (opacity * 0.2)});`;
                    nodeContent = `<span class="font-display font-bold text-[10px]" style="color:${c.color}">${pct}%</span>`;
                }

                const clickAttr = interactive ? `onclick="selectNenType('${c.id}')"` : '';
                const cursor = interactive ? 'cursor-pointer' : 'cursor-default';

                return `
                    <div class="absolute w-12 h-12 flex items-center justify-center ${cursor} transition-all duration-500 ease-out z-10" 
                         style="top: ${top}%; left: ${left}%; transform: translate(-50%, -50%);" 
                         ${clickAttr}>
                        <div class="w-full h-full rounded-full border-2 bg-gray-950 flex items-center justify-center transition-all duration-300" 
                             style="${borderStyle}">
                            ${nodeContent}
                        </div>
                        ${isSelected ? `<div class="absolute -inset-2 rounded-full border border-${c.color} opacity-30 animate-pulse"></div>` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="relative w-full aspect-square max-w-[320px] mx-auto my-4">
                    <!-- Camada SVG -->
                    <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100">
                        <!-- Hexágono Externo -->
                        <polygon points="${polyPoints}" fill="none" stroke="#1f2937" stroke-width="1" />
                        
                        <!-- Linhas de Fundo (Raios) -->
                        ${points.map(p => `<line x1="50" y1="50" x2="${p.x}" y2="${p.y}" stroke="#1f2937" stroke-width="0.5" />`).join('')}
                        
                        <!-- Linha Ativa -->
                        ${selPoint ? `<line x1="50" y1="50" x2="${selPoint.x}" y2="${selPoint.y}" stroke="${color}" stroke-width="1.5" stroke-dasharray="2" class="animate-pulse">
                            <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite" />
                        </line>` : ''}
                        <!-- Hexágono Brilho -->
                        <polygon points="${polyPoints}" fill="none" stroke="${color}" stroke-width="0.5" stroke-opacity="0.3" />
                    </svg>
                    
                    <!-- Núcleo Central -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-gray-900/80 rounded-full border border-gray-700 flex items-center justify-center backdrop-blur-sm z-0">
                        <div class="text-[${color}] opacity-20"><i data-lucide="hexagon" size="32"></i></div>
                    </div>

                    <!-- Nodos -->
                    ${nodesHtml}
                </div>
                <div class="text-center mt-2">
                     <h3 class="text-2xl font-display font-black tracking-widest uppercase drop-shadow-lg transition-all duration-300" style="color: ${color};">${selectedId}</h3>
                     ${interactive ? `<p class="text-xs text-gray-500 font-bold uppercase tracking-widest mt-1">Selecione seu tipo de Aura</p>` : ''}
                </div>
            `;
        }

        async function checkDiscordAuth() {
            // Check for token in URL hash (Callback from Discord)
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            let accessToken = fragment.get('access_token');

            if (accessToken) {
                // Clear hash from URL for cleanliness
                window.history.replaceState(null, null, window.location.pathname);
                localStorage.setItem('discord_access_token', accessToken);
            } else {
                accessToken = localStorage.getItem('discord_access_token');
            }

            if (!accessToken) {
                state.authorized = false;
                state.view = 'LOGIN';
                render();
                return;
            }

            try {
                // Fetch User Profile
                const userRes = await fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });

                if (!userRes.ok) throw new Error('Invalid Token');
                const user = await userRes.json();
                state.user = user;

                // Check Whitelist (Paid Users) - Bypass Server Check
                if (PAID_USERS.includes(user.id)) {
                    state.authorized = true;
                    state.view = 'LIST';
                    render();
                    return;
                }

                // Check Guild Membership & Roles
                const memberRes = await fetch(`https://discord.com/api/users/@me/guilds/${DISCORD_CONFIG.guildId}/member`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });

                if (memberRes.ok) {
                    const member = await memberRes.json();
                    if (member.roles && member.roles.includes(DISCORD_CONFIG.roleId)) {
                        state.authorized = true;
                        state.view = 'LIST';
                    } else {
                        alert('Acesso Negado: Você não possui o cargo necessário no servidor.');
                        logoutDiscord();
                        return;
                    }
                } else {
                    alert('Acesso Negado: Você não é membro do servidor oficial.');
                    logoutDiscord();
                    return;
                }
                render();

            } catch (e) {
                console.error("Auth Error", e);
                logoutDiscord();
            }
        }

window.calcularPHBase = function(level) {
    const lvl = parseInt(level) || 1;
    if (lvl >= 12) return 25;  // 6+2+2+2+2+3+3+3+1 (aprox)
    if (lvl >= 11) return 22;
    if (lvl >= 10) return 19;
    if (lvl >= 9)  return 16;
    if (lvl >= 8)  return 13;
    if (lvl >= 7)  return 10;
    if (lvl >= 6)  return 7;
    if (lvl >= 5)  return 14; // nível 5 = 6+2+2+2+2 = 14
    if (lvl >= 4)  return 12;
    if (lvl >= 3)  return 10;
    if (lvl >= 2)  return 8;
    return 6; // nível 1
};

// ══════════════════════════════════════════════════════════
//  renderHatsuCreator — wizard multi-etapas
// ══════════════════════════════════════════════════════════
function renderHatsuCreator(container) {
    const char = state.currentChar;
    const cls  = char.class;
    const catDB = window.HATSU_DB.categorias[cls] || window.HATSU_DB.categorias['INTENSIFICAÇÃO'];
    const tc   = catDB.cor || '#00ff88';

    // Inicializa o builder
    if (!state.hatsuBuilder) {
        state.hatsuBuilder = { step:0, nome:'', descricao:'', tipo:'', rg:[], rc:[], eg:[], ec:[] };
    }
    const hb = state.hatsuBuilder;

    const pnMax = window.calcularPHBase(char.level);
    let pnUsed = 0;
    hb.eg.forEach(id => { const e = window.HATSU_DB.efeitos_gerais.find(x=>x.id===id); if(e) pnUsed += e.pn; });
    hb.ec.forEach(id => { const e = catDB.efeitos.find(x=>x.id===id); if(e) pnUsed += e.pn; });
    const pnLeft = pnMax - pnUsed;

    const STEPS = ['CONCEITO','TIPO','REST. GERAIS','REST. CATEG.','EFEITOS GERAIS','EFEITOS CATEG.','RESUMO'];

    // ── helpers ──
    const palR = {

        pesada:  { bs:'#ef4444', bun:'#7f1d1d55', bg:'#ef444418', badge:'#f8717155', bt:'#f87171' },
        variavel:{ bs:'#a855f7', bun:'#3b076455', bg:'#a855f718', badge:'#c084fc55', bt:'#c084fc' },
        extrema: { bs:'#f97316', bun:'#7c2d1255', bg:'#f9731618', badge:'#fb923c55', bt:'#fb923c' },
    };

    function renderR(items, arr, tipo) {
        return items.map(item => {
            const sel = arr.includes(item.id);
            const pw = item.peso || 'leve';
            const p  = palR[pw] || palR.leve;
            return `<div onclick="window._hToggleR('${item.id}','${tipo}')"

    function renderE(items, arr, tipo, color) {

// ── Handlers globais do Hatsu Creator ──
window._hUpdateNome = function(val, tc, el) {
    if (!state.hatsuBuilder) return;
    state.hatsuBuilder.nome = val;
    if (el) el.style.borderColor = val.trim() ? tc : '#1f2937';
    // Atualiza visual do botão sem re-renderizar toda a tela
    const btn = document.querySelector('#hatsu-next-btn');
    if (btn) {
        if (val.trim()) {
            btn.style.background = tc;
            btn.style.color = '#000';
            btn.style.opacity = '1';
            btn.style.boxShadow = '0 0 18px ' + tc + '66';
        } else {
            btn.style.background = '#1f2937';
            btn.style.color = '#4b5563';
            btn.style.opacity = '0.55';
            btn.style.boxShadow = 'none';
        }
    }
};

window._hNext = function() {
    const hb = state.hatsuBuilder; if (!hb) return;
    // Validação por etapa
    if (hb.step === 0 && !hb.nome.trim()) {
        const input = document.getElementById('hatsu-nome-input');
        if (input) { input.focus(); input.style.borderColor = '#ef4444'; }
        return;
    }
    if (hb.step === 1 && !hb.tipo) {
        return; // usuário precisa selecionar um tipo — os cards são clicáveis
    }
    if (hb.step === 6) {
        // Salva o hatsu
        const char = state.currentChar;
        if (!char.hatsus) char.hatsus = [];
        const catDB = window.HATSU_DB.categorias[char.class];
        let pnUsed = 0;
        hb.eg.forEach(id => { const e = window.HATSU_DB.efeitos_gerais.find(x=>x.id===id); if(e) pnUsed+=e.pn; });
        hb.ec.forEach(id => { if(catDB){ const e=catDB.efeitos.find(x=>x.id===id); if(e) pnUsed+=e.pn; } });
        const hatsuData = {
            id: (hb.editingIdx !== undefined ? char.hatsus[hb.editingIdx].id : null) || ('hatsu_' + Date.now()),
            nome: hb.nome,
            descricao: hb.descricao,
            tipo: hb.tipo,
            restricoes: [...hb.rg, ...hb.rc],
            efeitos: [...hb.eg, ...hb.ec],
            pnUsados: pnUsed,
            nivel: char.level,
            classe: char.class,
            criadoEm: (hb.editingIdx !== undefined ? char.hatsus[hb.editingIdx].criadoEm : null) || new Date().toLocaleDateString('pt-BR')
        };
        if (hb.editingIdx !== undefined) {
            char.hatsus[hb.editingIdx] = hatsuData;
        } else {
            char.hatsus.push(hatsuData);
        }
        saveCharacter(char);
        state.hatsuBuilder = null;
        state.view = 'SHEET';
        state.activeTab = 'NEN';
        render();
        return;
    }
    hb.step++;
    render();
};
window._hPrev = function() {
    const hb = state.hatsuBuilder; if (!hb || hb.step === 0) return;
    hb.step--;
    render();
};
window._hToggleR = function(id, tipo) {
    const hb = state.hatsuBuilder; if (!hb) return;
    const arr = tipo === 'rg' ? hb.rg : hb.rc;
    const idx = arr.indexOf(id);
    if (idx > -1) arr.splice(idx, 1); else arr.push(id);
    render();
};
window._hToggleE = function(id, tipo, pn) {
    const hb = state.hatsuBuilder; if (!hb) return;
    const arr = tipo === 'eg' ? hb.eg : hb.ec;
    const idx = arr.indexOf(id);
    if (idx > -1) {
        arr.splice(idx, 1);
    } else {
        // Verifica P.N
        let used = 0;
        hb.eg.forEach(eid => { const e = window.HATSU_DB.efeitos_gerais.find(x=>x.id===eid); if(e) used+=e.pn; });
        const cls = state.currentChar.class;
        hb.ec.forEach(eid => { const cat = window.HATSU_DB.categorias[cls]; if(cat){ const e=cat.efeitos.find(x=>x.id===eid); if(e) used+=e.pn; } });
        if (used + pn > window.calcularPHBase(state.currentChar.level)) return;
        arr.push(id);
    }
    render();
};

        function changeLevel(delta) { const char = state.currentChar; const newLevel = char.level + delta; if (newLevel < 0) return; if (delta > 0) { const hasGiantBody = char.inclinations.positive.some(i => i.nome === "Corpo de Gigante"); const bonus = hasGiantBody ? 3 : 0; const conMod = getMod(char.attributes.CON.value); const rollInput = prompt(`SUBIR DE NÍVEL (${newLevel})\n\nInsira o valor da rolagem de vida (Dado de Vida da Classe):`, "5"); if (rollInput === null) return; const roll = parseInt(rollInput) || 0; const totalGain = roll + conMod + bonus; char.vitals.hpMax += totalGain; char.vitals.hp += totalGain; alert(`Nível ${newLevel} alcançado!\n\nVida aumentada em ${totalGain}:\n• Rolagem: ${roll}\n• CON: ${conMod}\n• Corpo de Gigante: +${bonus}`); } else { if(!confirm("Reduzir nível não desfaz automaticamente os ganhos de vida. Continuar?")) return; } char.level = newLevel; saveCharacter(char); render(true); }
        function toggleSheetAccordion() { state.sheetOtherSkillsOpen = !state.sheetOtherSkillsOpen; render(true); }
        function handleArmorClick() { alert('Funcionalidade de Armadura em desenvolvimento.'); }
        function uploadCharacterImage(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = function(e) { state.currentChar.imageUrl = e.target.result; saveCharacter(state.currentChar); render(true); }; reader.readAsDataURL(input.files[0]); } }
        function addItem() { const name = document.getElementById('new-item-name').value; if (name) { state.currentChar.inventory.push({ name, qty: 1 }); saveCharacter(state.currentChar); render(true); } }
        function updateItemQty(idx, delta) { const item = state.currentChar.inventory[idx]; item.qty += delta; if (item.qty <= 0) state.currentChar.inventory.splice(idx, 1); saveCharacter(state.currentChar); render(true); }
        function updateMoney(val) { state.currentChar.money = parseInt(val) || 0; saveCharacter(state.currentChar); render(true); }
        function clearHistory() { if(confirm('Limpar histórico?')) { state.currentChar.history = []; saveCharacter(state.currentChar); render(true); } }
        function toggleBioAccordion(id) { state.bioAccordionOpen = state.bioAccordionOpen === id ? null : id; render(true); }
        function updateBio(field, val) { if (!state.currentChar.bio) state.currentChar.bio = {}; state.currentChar.bio[field] = val; saveCharacter(state.currentChar); render(true); }

// ══════════════════════════════════════════════════════════
//  renderHatsuDetail — tela de visualização do Hatsu
// ══════════════════════════════════════════════════════════
function renderHatsuDetail(container) {
    const char  = state.currentChar;
    const idx   = state.hatsuDetailIdx || 0;
    const h     = (char.hatsus || [])[idx];
    if (!h) { state.view = 'SHEET'; state.activeTab = 'NEN'; render(); return; }

    const catDB = (window.HATSU_DB && window.HATSU_DB.categorias[h.classe]) ||
                  (window.HATSU_DB && window.HATSU_DB.categorias[char.class]) || {};
    const tc    = catDB.cor || '#00ff88';
    const pnMax = window.calcularPHBase ? window.calcularPHBase(h.nivel||1) : 6;

    const tipoIcons = { hostil:'⚔️', suporte:'🛡️', versatil:'🌀', instantaneo:'⚡', longa_duracao:'⏳' };
    const tipoNames = { hostil:'Hostil', suporte:'Suporte', versatil:'Versátil', instantaneo:'Instantâneo', longa_duracao:'Longa Duração' };

    // Resolve nomes completos das restrições
    const allRDB = [];
    if (window.HATSU_DB) {
        const rg = window.HATSU_DB.restricoes_gerais;
        ['leves','moderadas','pesadas','variaveis','extremas'].forEach(k => {
            (rg[k]||[]).forEach(r => allRDB.push({...r, grupo:k}));
        });
        if (catDB.restricoes) catDB.restricoes.forEach(r => allRDB.push({...r, grupo:'categoria'}));
    }
    const allEDB = [];
    if (window.HATSU_DB) {
        (window.HATSU_DB.efeitos_gerais||[]).forEach(e => allEDB.push({...e, origem:'geral'}));
        if (catDB.efeitos) catDB.efeitos.forEach(e => allEDB.push({...e, origem:'categoria'}));
    }

    const restricoesSel = (h.restricoes||[]).map(id => allRDB.find(r=>r.id===id)).filter(Boolean);
    const efeitosSel    = (h.efeitos||[]).map(id => allEDB.find(e=>e.id===id)).filter(Boolean);

    // ── Cálculo de Dano Final ──────────────────────────────────────────────────
    const DAMAGE_TABLE = [
        '1d4','1d6','1d8','2d4','1d10','1d12',
        '2d6',  // ← índice 6 (base)
        '3d4','2d8','4d4','3d6','2d10','5d4','2d12',
        '3d8','4d6','6d4','7d4','3d10','5d6','4d8',
        '3d12','8d4','6d6','9d4','4d10','10d4','4d12',
        '5d8','7d6','6d8','8d6','5d10','9d6','7d8',
        '5d12','6d10','10d6','8d8','7d10','6d12','9d8',
        '8d10','10d8','7d12','9d10','8d12','10d10','9d12',
        '10d12'
    ];
    const BASE_DAMAGE_IDX = 6; // 2d6

    // Graus de dano concedidos por restrições/efeitos específicos
    const DANO_GRAU_MAP = {
        // Restrições gerais
        'rg_l1':  1,  // Cálculo Pensado 1 → +1 Grau/Passo
        'rg_l7':  1,  // "Diálogo" → +1 Grau/Passo Dano
        'rg_m1':  2,  // Alvo Único em Combate → +2 Grau/Passo Dano
        'rg_m13': 2,  // Zetsu Protetivo → +2 Grau/Passo (inclui dano)
        'rg_v2':  1,  // Canalizar com Concentração → +X (mín 1)
        // Restrições de categoria
        'ri_l1':  1,  // PV < 75% → +1 grau/passo dano
        'rt_m1':  2,  // Dor Reflexiva Elemental → +2 Graus
        // Efeitos gerais com dano
        'eg10':   0,  // Flagelo da Mente → dano psíquico fixo 1d8 (tratado à parte)
        'eg15':   1,  // Dano/Cura Focal → +1 grau/passo
        // Efeitos de Intensificação (graus de dano)
        'ri_e1':  1,'ri_e2': 1,'ri_e3': 2,'ri_e4': 2,'ri_e6': 1,'ri_e8': 2,'ri_e10': 2,
        'ri_e12': 3,'ri_e16': 2,'ri_e20': 3,'ri_e22': 3,'ri_e24': 4,'ri_e26': 4,'ri_e30': 5,
    };

    // Efeitos que CONCEDEM dano próprio (tornam o hatsu "com dano" independente do tipo)
    // Estrutura: id → { dado, desc }
    const DANO_PROPRIO_MAP = {
        'eg10':   { dado: '1d8',      tipo: 'Psíquico',   desc: 'Flagelo da Mente' },
        'eg17':   { dado: '(contínuo)',tipo: 'Contínuo',   desc: 'Dor pra Disgrama!' },
        'ri_e11': { dado: '+ 1d8',    tipo: 'Extra',      desc: 'Golpe Reforçado' },
        'ri_e13': { dado: '+ 1d(maior)',tipo:'Bloquear',   desc: 'Onda Surda' },
        'ri_e20': { dado: '+ 1d6',    tipo: 'Extra',      desc: 'Fúria Potencializada' },
        'rm_e1':  { dado: '1d4',      tipo: 'Objeto',     desc: 'Materialização Simples' },
        'rm_e9':  { dado: '1d8',      tipo: 'Corporal',   desc: 'Alteração Corporal' },
        'em_e1':  { dado: '1d8',      tipo: 'Projétil',   desc: 'Projétil de Aura' },
        'em_e3':  { dado: '2d6',      tipo: 'Potente',    desc: 'Disparo Potente' },
        'em_e6':  { dado: '3d6',      tipo: 'Linha',      desc: 'Canhão de Aura' },
        'em_e9':  { dado: '4d6',      tipo: 'Área',       desc: 'Bomba de Aura' },
        'rt_e16': { dado: '+5 dano',  tipo: 'Ferida',     desc: 'Ferida Interna' },
    };

    // Tipos e categorias que têm dano base (2d6 + attr)
    const tipoTemDano = ['hostil','versatil','instantaneo'];
    const catTemDano  = ['INTENSIFICAÇÃO','REFORÇO','TRANSMUTAÇÃO','EMISSÃO'];
    const isHostil    = tipoTemDano.includes(h.tipo);
    const catDmg      = catTemDano.some(c => c === (h.classe||char.class));

    // Verifica se algum efeito selecionado concede dano próprio
    const efeitosComDanoProprio = efeitosSel.filter(e => DANO_PROPRIO_MAP[e.id] && e.id !== 'eg10');
    const temFlagelo = efeitosSel.some(e => e.id === 'eg10');
    const hasEfeitoDano = efeitosComDanoProprio.length > 0 || temFlagelo;

    // Hatsu tem dano base se: tipo hostil/versátil/instantâneo, OU categoria ofensiva, OU tem efeito com dano
    const hasBaseDmg = isHostil || catDmg || hasEfeitoDano;

    // Calcula graus totais de dano (só aplica se há dano base)
    let totalGraus = 0;
    const grauSources = [];
    [...restricoesSel, ...efeitosSel].forEach(item => {
        const g = DANO_GRAU_MAP[item.id];
        if (g && g > 0) {
            totalGraus += g;
            grauSources.push({ nome: item.nome, graus: g });
        }
    });

    // Atributo base pelo tipo/categoria
    const attrMap = {
        'INTENSIFICAÇÃO':'FOR','REFORÇO':'FOR',
        'TRANSMUTAÇÃO':'DES','EMISSÃO':'INT',
        'MATERIALIZAÇÃO':'INT','MANIPULAÇÃO':'CAR',
        'ESPECIALIZAÇÃO':'CAR',
    };
    const baseAttr = attrMap[h.classe||char.class] || 'FOR';

    let calcDanoHtml = '';
    if (hasBaseDmg) {
        const danoColor = totalGraus > 0 ? '#f87171' : '#d1d5db';
        const grauDelta = totalGraus > 0 ? `+${totalGraus}` : totalGraus < 0 ? `${totalGraus}` : '';

        // Bloco de dano base (2d6 escalado)
        let baseDmgSection = '';
        if (isHostil || catDmg) {
            const finalIdx = Math.min(BASE_DAMAGE_IDX + totalGraus, DAMAGE_TABLE.length - 1);
            const finalDice = DAMAGE_TABLE[finalIdx];
            baseDmgSection = `
                <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px">
                    <div style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;color:${danoColor};text-shadow:0 0 14px ${danoColor}66;line-height:1">${finalDice}</div>
                    <div style="font-size:14px;font-weight:700;color:#6b7280">+ ${baseAttr}</div>
                    ${totalGraus > 0 ? `<div style="font-size:9px;color:#4b5563;font-style:italic">(base 2d6)</div>` : ''}
                </div>`;
        }

        // Danos extras de efeitos próprios
        let extraDmgSection = '';
        if (temFlagelo) {
            extraDmgSection += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:#a78bfa">1d8</span>
                <span style="font-size:10px;color:#7c3aed;font-weight:700">Psíquico</span>
                <span style="font-size:9px;color:#4b5563">Flagelo da Mente</span>
            </div>`;
        }
        efeitosComDanoProprio.forEach(e => {
            const d = DANO_PROPRIO_MAP[e.id];
            if (!d) return;
            const typeColors = { 'Projétil':'#38bdf8','Potente':'#38bdf8','Linha':'#38bdf8','Área':'#f87171','Objeto':'#a3e635','Corporal':'#a3e635','Extra':'#fb923c','Bloquear':'#fb923c','Contínuo':'#f43f5e','Ferida':'#f43f5e' };
            const ec = typeColors[d.tipo] || '#9ca3af';
            extraDmgSection += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:${ec}">${d.dado}</span>
                <span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:${ec}22;color:${ec}">${d.tipo}</span>
                <span style="font-size:9px;color:#4b5563">${d.desc}</span>
            </div>`;
        });

        // Chips de fontes de grau
        const sourcesHtml = grauSources.length > 0
            ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${grauSources.map(s =>
                `<span style="font-size:7px;font-weight:900;background:#ef444418;color:#f87171;padding:2px 6px;border-radius:4px">+${s.graus} grau · ${s.nome}</span>`
              ).join('')}</div>`
            : '';

        calcDanoHtml = `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #1f2937">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;letter-spacing:1px">💥 Dano Final</div>
                ${grauDelta ? `<span style="font-size:7px;font-weight:900;padding:2px 8px;border-radius:10px;background:#ef444422;color:#f87171">${grauDelta} grau${Math.abs(totalGraus)!==1?'s':''}</span>` : ''}
            </div>
            ${baseDmgSection}
            ${extraDmgSection}
            ${sourcesHtml}
        </div>`;
    }
    // ── Fim cálculo de dano ────────────────────────────────────────────────────

    const palBadge = {
        leves:    {bg:'#22c55e22',tc:'#4ade80',label:'LEVE'},
        moderadas:{bg:'#eab30822',tc:'#fbbf24',label:'MOD'},
        pesadas:  {bg:'#ef444422',tc:'#f87171',label:'PES'},
        variaveis:{bg:'#a855f722',tc:'#c084fc',label:'VAR'},
        extremas: {bg:'#f9731622',tc:'#fb923c',label:'EXT'},
        categoria:{bg:'#ffffff11',tc:'#9ca3af', label:'CAT'},
    };

    const rHtml = restricoesSel.length
        ? restricoesSel.map(r => {
            const p = palBadge[r.grupo] || palBadge.categoria;
            return `<div style="display:flex;align-items:flex-start;gap:10px;background:#0d1117;border-radius:10px;padding:12px;border:1px solid #1f2937;margin-bottom:8px">
                <span style="font-size:7px;font-weight:900;padding:3px 6px;border-radius:4px;background:${p.bg};color:${p.tc};text-transform:uppercase;flex-shrink:0;margin-top:2px;letter-spacing:1px">${p.label}</span>
                <div>
                    <div style="font-size:11px;font-weight:700;color:#e5e7eb;margin-bottom:3px">${r.nome}</div>
                    <div style="font-size:9px;color:#6b7280;line-height:1.5;margin-bottom:4px">${r.desc}</div>
                    <div style="font-size:9px;font-weight:700;color:${p.tc}">⚡ ${r.bnf}</div>
                </div>
            </div>`;
          }).join('')
        : `<div style="text-align:center;color:#374151;font-style:italic;font-size:11px;padding:20px">Nenhuma restrição selecionada.</div>`;

    const eHtml = efeitosSel.length
        ? efeitosSel.map(e => {
            const isGeral = e.origem === 'geral';
            const ec = isGeral ? '#9ca3af' : tc;
            const costColor = (e.pn||1) >= 3 ? '#f87171' : (e.pn||1) >= 2 ? '#fbbf24' : '#6b7280';
            return `<div style="display:flex;align-items:flex-start;gap:10px;background:#0d1117;border-radius:10px;padding:12px;border:2px solid ${ec}22;margin-bottom:8px">
                <div style="flex-shrink:0;margin-top:2px">
                    <span style="font-size:7px;font-weight:900;padding:3px 6px;border-radius:4px;background:${costColor}22;color:${costColor};letter-spacing:1px">${e.pn||1} P.N</span>
                </div>
                <div>
                    <div style="font-size:11px;font-weight:700;color:${ec};margin-bottom:3px">${e.nome}</div>
                    <div style="font-size:9px;color:#6b7280;line-height:1.5;margin-bottom:4px">${e.desc}</div>
                    <div style="font-size:8px;color:#374151;font-style:italic">Req: ${e.req||'—'}</div>
                </div>
            </div>`;
          }).join('')
        : `<div style="text-align:center;color:#374151;font-style:italic;font-size:11px;padding:20px">Nenhum efeito selecionado.</div>`;

    container.innerHTML = `

            <div style="flex:1;min-width:0">
                <div style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:12px;color:${tc};text-transform:uppercase;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.nome||'Hatsu'}</div>
                <div style="font-size:8px;color:#4b5563;margin-top:1px">${h.classe||char.class} · ${tipoNames[h.tipo]||'—'} · Nível ${h.nivel||'?'}</div>
            </div>
            <button onclick="openHatsuEdit(${idx})"
                style="flex-shrink:0;padding:7px 14px;border-radius:8px;background:${tc}22;border:1px solid ${tc}55;color:${tc};font-family:'Orbitron',sans-serif;font-weight:900;font-size:9px;text-transform:uppercase;cursor:pointer;letter-spacing:1px">✏️ Editar</button>
        </div>

        <!-- CONTEÚDO SCROLLÁVEL -->
        <div style="flex:1;overflow-y:auto;padding:16px" class="custom-scrollbar">

            <!-- Card principal -->
            <div style="text-align:center;padding:20px 16px;border-radius:16px;border:2px solid ${tc};background:${tc}08;margin-bottom:16px">
                <div style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;color:${tc};text-transform:uppercase;letter-spacing:2px;line-height:1.2;margin-bottom:6px">${h.nome||'SEM NOME'}</div>
                <div style="display:inline-flex;align-items:center;gap:6px;background:#ffffff08;border-radius:20px;padding:5px 12px;margin-bottom:${h.descricao?'12px':'0'}">
                    <span style="font-size:14px">${tipoIcons[h.tipo]||'✦'}</span>
                    <span style="font-size:10px;font-weight:700;color:#d1d5db">${tipoNames[h.tipo]||'—'}</span>
                </div>
                ${h.descricao?`<div style="font-size:10px;color:#6b7280;font-style:italic;line-height:1.6;margin-top:8px;padding:0 8px">"${h.descricao}"</div>`:''}
            </div>

                    <div style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:#fff">${h.pnUsados||0}<span style="font-size:8px;color:#374151">/${pnMax}</span></div>
                </div>

                    <div style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:${tc}">${efeitosSel.length}</div>

                <div style="background:#0d1117;border:1px solid #ef444433;border-radius:10px;padding:10px;text-align:center">

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <div>
                        <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;margin-bottom:2px">Ativação</div>
                        <div style="font-size:10px;color:#d1d5db;font-weight:600">Ação Principal</div>
                    </div>
                    <div>
                        <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;margin-bottom:2px">Custo Base</div>
                        <div style="font-size:10px;color:#d1d5db;font-weight:600">50% de Aura</div>
                    </div>

                        <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;margin-bottom:2px">Alcance</div>
                        <div style="font-size:10px;color:#d1d5db;font-weight:600">Pessoal / Toque</div>
                    </div>
                    <div>
                        <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;margin-bottom:2px">Duração</div>
                        <div style="font-size:10px;color:#d1d5db;font-weight:600">Instantâneo</div>
                    </div>
                    <div>
                        <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;margin-bottom:2px">Categoria</div>
                        <div style="font-size:10px;font-weight:700;color:${tc}">${h.classe||char.class}</div>
                    </div>
                    <div>
                        <div style="font-size:8px;color:#374151;text-transform:uppercase;font-weight:700;margin-bottom:2px">Criado em</div>
                        <div style="font-size:10px;color:#d1d5db;font-weight:600">${h.criadoEm||'—'}</div>
                    </div>
                </div>
                ${calcDanoHtml}
            </div>

            <!-- Restrições -->
            <div style="margin-bottom:20px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                    <span style="font-size:14px">⛓</span>
                    <span style="font-size:10px;font-weight:900;color:#e5e7eb;text-transform:uppercase;letter-spacing:2px">Restrições</span>
                    <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:#ef444422;color:#f87171">${restricoesSel.length}</span>
                </div>
                ${rHtml}
            </div>

            <!-- Efeitos -->
            <div style="margin-bottom:24px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                    <span style="font-size:14px">⚡</span>
                    <span style="font-size:10px;font-weight:900;color:#e5e7eb;text-transform:uppercase;letter-spacing:2px">Efeitos</span>
                    <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:${tc}22;color:${tc}">${efeitosSel.length}</span>
                </div>
                ${eHtml}
            </div>

        </div>

        <!-- RODAPÉ -->
        <div style="padding:12px 14px;border-top:1px solid #111827;background:#0a0f1a;flex-shrink:0;display:flex;gap:8px">
            <button onclick="state.view='SHEET';state.activeTab='NEN';render()"
                style="flex:1;padding:12px;border-radius:10px;background:#111827;border:1px solid #1f2937;color:#9ca3af;font-family:'Orbitron',sans-serif;font-weight:900;font-size:10px;text-transform:uppercase;cursor:pointer;letter-spacing:1px">← Voltar</button>
            <button onclick="openHatsuEdit(${idx})"
                style="flex:1;padding:12px;border-radius:10px;background:${tc};color:#000;font-family:'Orbitron',sans-serif;font-weight:900;font-size:10px;text-transform:uppercase;cursor:pointer;letter-spacing:1px;border:none;box-shadow:0 0 16px ${tc}55">✏️ Editar Hatsu</button>
        </div>
    </div>`;

    if (window.lucide) lucide.createIcons();
}

function openHatsuDetail(idx) {
    state.hatsuDetailIdx = idx;
    state.view = 'HATSU_DETAIL';
    render();
}

function openHatsuEdit(idx) {
    const char = state.currentChar;
    const h = (char.hatsus||[])[idx];
    if (!h) return;
    // Pré-popula o builder com os dados do hatsu existente
    state.hatsuBuilder = {
        step: 0,
        nome: h.nome || '',
        descricao: h.descricao || '',
        tipo: h.tipo || '',
        rg: (h.restricoes||[]).filter(id => id.startsWith('rg_')),
        rc: (h.restricoes||[]).filter(id => !id.startsWith('rg_')),
        eg: (h.efeitos||[]).filter(id => id.startsWith('eg')),
        ec: (h.efeitos||[]).filter(id => !id.startsWith('eg')),
        editingIdx: idx  // marca que é edição, não criação
    };
    state.view = 'HATSU_CREATOR';
    render();
}

//Criação de Nen
function openHatsuCreator() {
    state.view = 'HATSU_CREATOR';
    state.hatsuBuilder = { step:0, nome:'', descricao:'', tipo:'', rg:[], rc:[], eg:[], ec:[] };
    render();
}

function closeHatsuCreator() {
    state.view = 'SHEET'; // Volta para a ficha
    state.activeTab = 'NEN'; // Garante que volta na aba de Nen
    render();
}

        window.addEventListener('DOMContentLoaded', () => { loadCharacters(); setThemeColor('#00ff9d'); checkDiscordAuth(); });
    </script>
</body>
</html>
